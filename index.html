<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>필사메이커 (프로토타입)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <h1>필사메이커</h1>
  <p class="subtitle">마음에 드는 문장을 옮겨 적고, 나만의 필사책으로 만들어보세요.</p>

  <section class="settings" aria-label="템플릿 설정">
    <h2 class="settings-title">템플릿 설정</h2>

    <div class="settings-row">
      <span class="settings-label">표지 제목</span>
      <input type="text" id="cover-title-input" class="title-input" value="나의 문장들" maxlength="40">
    </div>

    <div class="settings-row">
      <span class="settings-label">색상 팔레트</span>
      <div class="palette-options">
        <label class="palette-option">
          <input type="radio" name="palette" value="sage" checked>
          <span class="swatch swatch-sage" aria-hidden="true"></span>
          <span class="palette-name">세이지그린</span>
        </label>
        <label class="palette-option">
          <input type="radio" name="palette" value="beige">
          <span class="swatch swatch-beige" aria-hidden="true"></span>
          <span class="palette-name">웜베이지</span>
        </label>
        <label class="palette-option">
          <input type="radio" name="palette" value="rose">
          <span class="swatch swatch-rose" aria-hidden="true"></span>
          <span class="palette-name">더스티로즈</span>
        </label>
        <label class="palette-option">
          <input type="radio" name="palette" value="charcoal">
          <span class="swatch swatch-charcoal" aria-hidden="true"></span>
          <span class="palette-name">차콜</span>
        </label>
      </div>
    </div>

    <div class="settings-row">
      <span class="settings-label">페이지 크기</span>
      <label><input type="radio" name="page-size" value="a4" checked> A4</label>
      <label><input type="radio" name="page-size" value="a5"> A5</label>
    </div>

    <div class="settings-row">
      <span class="settings-label">줄 스타일</span>
      <label><input type="radio" name="line-style" value="ruled" checked> 가로줄 (필사 가이드라인)</label>
      <label><input type="radio" name="line-style" value="plain"> 무지 (줄 없음)</label>
    </div>
  </section>

  <textarea id="text-input" rows="12" placeholder="여기에 필사할 문장을 입력하세요..."></textarea>

  <button id="make-pdf-btn" type="button">PDF로 만들기</button>

  <p id="status-message" class="status" role="status" aria-live="polite"></p>
</main>

<script src="lib/jspdf.umd.min.js"></script>
<script src="assets/fonts/korean-font.js"></script>
<script src="script.js"></script>
</body>
</html>
