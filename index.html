<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>필사메이커 (프로토타입)</title>
<link rel="stylesheet" href="assets/fonts/ui-fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-scroll">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></div>
        <div class="brand-text">
          <h1>필사메이커</h1>
          <p class="subtitle">마음에 드는 문장을 옮겨 적고, 나만의 필사책으로 만들어보세요.</p>
        </div>
      </div>

      <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-settings">
        <span>템플릿 설정</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>

      <div class="sidebar-settings" id="sidebar-settings">

        <div class="settings-group">
          <label class="group-label" for="cover-title-input">표지 제목</label>
          <input type="text" id="cover-title-input" class="title-input" value="나의 문장들" maxlength="40">
        </div>

        <div class="settings-group">
          <span class="group-label">색상 팔레트</span>
          <div class="palette-options">
            <label class="palette-option">
              <span class="swatch swatch-sage" aria-hidden="true"></span>
              <span class="palette-name">세이지그린</span>
              <input type="radio" name="palette" value="sage" checked>
            </label>
            <label class="palette-option">
              <span class="swatch swatch-beige" aria-hidden="true"></span>
              <span class="palette-name">웜베이지</span>
              <input type="radio" name="palette" value="beige">
            </label>
            <label class="palette-option">
              <span class="swatch swatch-rose" aria-hidden="true"></span>
              <span class="palette-name">더스티로즈</span>
              <input type="radio" name="palette" value="rose">
            </label>
            <label class="palette-option">
              <span class="swatch swatch-charcoal" aria-hidden="true"></span>
              <span class="palette-name">차콜</span>
              <input type="radio" name="palette" value="charcoal">
            </label>
          </div>
        </div>

        <div class="settings-group">
          <span class="group-label">페이지 크기</span>
          <div class="toggle-group">
            <label class="toggle-pill">
              <span>A4</span>
              <input type="radio" name="page-size" value="a4" checked>
            </label>
            <label class="toggle-pill">
              <span>A5</span>
              <input type="radio" name="page-size" value="a5">
            </label>
          </div>
        </div>

        <div class="settings-group">
          <span class="group-label">줄 스타일</span>
          <div class="toggle-group">
            <label class="toggle-pill">
              <span>가로줄</span>
              <input type="radio" name="line-style" value="ruled" checked>
            </label>
            <label class="toggle-pill">
              <span>무지</span>
              <input type="radio" name="line-style" value="plain">
            </label>
          </div>
          <p class="group-caption">가로줄은 필사 가이드라인과 함께, 무지는 빈 줄만 인쇄됩니다.</p>
        </div>

        <div class="settings-group">
          <label class="group-label" for="text-input">필사할 문장</label>
          <textarea id="text-input" rows="10" placeholder="여기에 필사할 문장을 입력하세요..."></textarea>
        </div>

      </div>
    </div>

    <div class="sidebar-footer">
      <button id="make-pdf-btn" type="button">
        <span class="btn-icon" aria-hidden="true">⬇</span>
        <span>PDF로 만들기</span>
      </button>
      <p id="status-message" class="status" role="status" aria-live="polite"></p>
    </div>
  </aside>

  <main class="canvas-area">
    <div class="canvas-header">
      <div class="canvas-header-brand">
        <div class="canvas-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></div>
        <h2>필사메이커</h2>
      </div>
      <span class="canvas-status"><span class="status-check" aria-hidden="true">&#10003;</span>미리보기 자동 갱신됨</span>
    </div>
    <div class="canvas-stats">
      <div class="stat-card">
        <span class="stat-label">페이지 크기</span>
        <span class="stat-value" id="stat-page-size">A4</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">줄 스타일</span>
        <span class="stat-value" id="stat-line-style">가로줄</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">문장 수</span>
        <span class="stat-value" id="stat-sentence-count">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">예상 페이지</span>
        <span class="stat-value" id="stat-page-count">1</span>
      </div>
    </div>
    <div class="canvas-scroll">
      <div class="canvas-pages">
        <figure class="page-card">
          <div class="page-stack">
            <div class="page-sheet" id="preview-cover">
              <div class="cover-frame" id="cover-frame">
                <div class="cover-decor cover-decor-top"></div>
                <div class="cover-title" id="cover-title-preview"></div>
                <div class="cover-decor cover-decor-bottom"></div>
                <div class="cover-wordmark">필사메이커</div>
              </div>
            </div>
          </div>
          <figcaption>표지</figcaption>
        </figure>

        <figure class="page-card">
          <div class="page-stack">
            <div class="page-sheet" id="preview-body">
              <div class="body-content" id="body-content"></div>
              <div class="body-footer" id="body-footer-preview"></div>
            </div>
          </div>
          <figcaption>본문 <span class="figcaption-muted">(1페이지 미리보기)</span></figcaption>
        </figure>
      </div>
    </div>
  </main>

</div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="assets/fonts/korean-font.js"></script>
<script src="script.js"></script>
</body>
</html>
